<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>お絵描き評価ラボ</title><link rel="stylesheet" href="/style.css"><body>
<p style="padding: 0 20px"><a href="/model-comparison">全35枚：絵・rubric・モデル別点数を比較</a></p><header><h1>お絵描き評価ラボ</h1><p>AI reference は暫定評価です。画像・お題・理由を確認してレビューしてください。</p><p><a href="/score-comparison">本番得点候補の比較</a></p><p id="selection"></p><p id="progress"></p><p>まず「優先レビュー」の作品を確認してください。理由は各作品に表示されます。評価条件でモデルを選び、その欄にレビューしてください。score-v2の表示は補正前の基礎点です。</p><label>評価条件 <select id="version"></select></label><label>表示 <select id="filter"><option value="priority">優先レビュー（未レビュー）</option><option value="all">すべて</option><option value="pending">未レビューの評価</option><option value="check">要確認</option><option value="inappropriate">不適切</option></select></label><label><input type="checkbox" id="blind" checked>既存採点を隠す</label><label><input type="checkbox" id="accepted">比較を「妥当」の評価だけに限定</label><button id="refresh">再読み込み</button><p id="message" role="status"></p></header><details><summary>比較・得点分布・反復評価の統計</summary><pre id="stats"></pre></details><main id="works"></main><script type="module" src="/app.js"></script></body></html>
