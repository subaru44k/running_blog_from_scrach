repo:
  components:
    astro_blog:
      paths:
        - astro-blog/src/pages
        - astro-blog/src/layouts/Layout.astro
        - astro-blog/src/content
        - astro-blog/public
      integrations:
        - tailwind
        - react
      build:
        buildspec: astro-blog/buildspec.yml
        output_dir: astro-blog/dist
        codebuild:
          trigger: existing project started from AWS console, AWS MCP, or authenticated AWS CLI with the codex-prod profile; production builds pin the reviewed Git commit
          runtime: Node.js 20 via buildspec runtime-versions
          cache_paths:
            - /root/.npm/**/*
          deploy:
            target: S3 + CloudFront
            sync_strategy:
              - upload dist/_astro before HTML and retain older hashed assets
              - sync remaining files with --delete while excluding _astro/* and compare content/mtime rather than size only
            invalidation: create /* invalidation and fail the deploy unless GetInvalidation confirms completion
            invalidation_permissions:
              - cloudfront:CreateInvalidation
              - cloudfront:GetInvalidation
            smoke_check: production draw result HTML must reference the current build asset and that asset must return HTTP 200
            timing_logs:
              - npm ci astro-blog
              - npm ci admin-app
              - monthly summaries
              - Astro build
              - sanity check
              - asset-first S3 sync
              - CloudFront invalidation completion
        generated_monthly_summaries:
          script: admin-app/scripts/generate-monthly-summary.js
          filename_pattern: "{YYYY-MM}-summary.md"
          behavior:
            - stable summary slugs avoid random monthly summary URLs on each deploy
            - force mode deletes legacy "{YYYY-MM}-summary-*.md" files
            - existing stable summary files are rewritten only when content changes
        blog_index:
          module: astro-blog/src/lib/blog-index.ts
          responsibility:
            - cache getCollection results per build process
            - expose sorted and unsorted published blog post lists
            - preserve existing route output ordering for blog lists, sitemap, category maps, and calendar maps
        output_parity_check:
          baseline_dir: astro-blog/.dist-baseline
          command: npm run compare:dist --prefix astro-blog
        quick_check:
          command: npm run build:quick --prefix astro-blog
          env:
            ASTRO_BUILD_NO_POSTS: "1"
      deploy_targets:
        - CloudFront distribution EMED5317DC581
        - S3 bucket 20250805-subaru-running-blog-site
      url_routes:
        canonical:
          - /
          - /blog/
          - /archive/
          - /draw/
          - /draw/archive/
          - /draw/play/
          - /draw/result/
          - /games/
          - /games/balloon-catch/
          - /games/cushion-catch/
          - /games/tv-catch/
          - /games/window-catch/
          - /games/dressup/
          - /games/dressup-next/
          - /games/match-quiz/
          - /games/janken/
          - /games/clock/
          - /games/snake/
          - /games/maze/
          - /games/tic-tac-toe/
          - /games/reversi/
          - /games/music/
          - /running-pace/
          - /pdf-compress/
          - /contact/
          - /privacy/
          - /about/
        generated:
          - /ads.txt
          - /sitemap.xml
          - /category-map.json
          - /cal-map.json
          - /cal-map/{year}/{month}.json
        experimental_noindex: []
    admin_app:
      purpose: "管理UIとスクリプトによるブログ編集/生成"
      entry: admin-app/server.js
      blog_datetime:
        timezone: Asia/Tokyo
        storage: "offset付きISO 8601（+09:00）"
        manual_posts: "管理UIで日付と時刻を必須入力し、既存記事の時刻も編集時に保持する"
        summaries: "走行開始時刻を持たない月次サマリーは記事ページで日付のみ表示する"
      scripts:
        - admin-app/scripts/import-workouts.js
        - admin-app/scripts/import-fitbit-workouts.js
        - admin-app/scripts/generate-monthly-summary.js
        - admin-app/scripts/garmin.sh
        - admin-app/scripts/garmin.py
    lambdas:
      fitbit_callback:
        path: lambdas/fitbit-callback
        handler: index.mjs
        infra: cloudformation.yaml
      sign_upload_v3:
        path: lambdas/sign-upload-v3
        handler: index.mjs
    pdf_compress_service:
      path: pdf-compress-service
      docker:
        dockerfile: pdf-compress-service/Dockerfile
      lambda_entry: pdf-compress-service/lambda.js
    draw_backend:
      path: backend/draw
      handlers:
        - backend/draw/src/handlers/prompt.ts
        - backend/draw/src/handlers/uploadUrl.ts
        - backend/draw/src/handlers/submit.ts
        - backend/draw/src/handlers/leaderboard.ts
        - backend/draw/src/handlers/submission.ts
        - backend/draw/src/handlers/monthlyCleanup.ts

site:
  language: ja
  primary_content:
    - PDF compression tool
    - running pace calculator
    - 30-second drawing scoring game
    - mini games
    - running logs and race reports
  presentation:
    home_page:
      role: visual hub for primary content
      generated_assets:
        - astro-blog/public/images/site/home-hero.webp
        - astro-blog/public/images/site/tools-visual.webp
        - astro-blog/public/images/site/games-visual.webp
      notes:
        - generated images are decorative/supporting visuals only; all meaningful labels and calls to action remain HTML text
        - top page keeps direct routes to tools, games, and blog content visible before lower supporting links
  routing:
    canonical_routes:
      - /
      - /blog/
      - /archive/
      - /draw/
      - /draw/archive/
      - /draw/play/
      - /draw/result/
      - /games/
      - /games/balloon-catch/
      - /games/cushion-catch/
      - /games/tv-catch/
      - /games/window-catch/
      - /games/dressup/
      - /games/dressup-next/
      - /games/match-quiz/
      - /games/janken/
      - /games/clock/
      - /games/snake/
      - /games/maze/
      - /games/tic-tac-toe/
      - /games/reversi/
      - /games/music/
      - /running-pace/
      - /pdf-compress/
      - /contact/
      - /privacy/
      - /about/
    section_anchors:
      /running-pace/:
        - "#calculator"
        - "#table"
    experimental_noindex_routes: []
    not_found_policy:
      status: 404
      body: /404.html
      seo:
        canonical: disabled
        robots: noindex,follow
  seo:
    adsense:
      client: ca-pub-7941378059940304
      verification:
        head_meta:
          name: google-adsense-account
          content: ca-pub-7941378059940304
        script:
          src: "https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-7941378059940304"
      content_presentation:
        - top page links to the drawing game and mini games as primary site content
        - about page explains tools, games, and running logs consistently with the live navigation
        - draw and match-quiz pages include explanatory publisher content beyond the interactive UI
        - contact page lists accepted inquiry types while using X as the only public contact channel
      privacy_required_content:
        - disclose Google and third-party ad cookies
        - disclose personalized ads based on visits to this and other sites
        - link to Google Ads Settings and aboutads.info choices
        - describe drawing game image/ranking data use
      ads_txt:
        route: /ads.txt
        source: astro-blog/public/ads.txt
        content: "google.com, pub-7941378059940304, DIRECT, f08c47fec0942fa0"
    article_noindex_categories:
      - 練習(弱)
      - 練習(中)
      - 練習(デフォルト)
    article_noindex_slug_contains:
      - -summary-
      - -summary
    sitemap_excludes_article_categories:
      - 練習(弱)
      - 練習(中)
      - 練習(デフォルト)
    sitemap_excludes_article_slug_contains:
      - -summary-
      - -summary

features:
  pdf_compress:
    steps:
      - sign-upload: create presigned POST (url + fields)
      - upload: POST PDF to S3 uploads/
      - compress: call /compress level=1/2/3 (parallel)
      - outputs: store outputs/*.pdf
      - previews: store previews/*.png (best-effort)
    upload_max_mb: 50
    url_ttl_seconds:
      download_preview: 600
      upload: 600
    aws_resources:
      api_gateway: pdf-compress-api (6zzbxx14u6)
      uploads_bucket: pdf-compress-uploads-prod
      compress_lambda: pdf-compress-lambda
      sign_upload_lambda: pdf-sign-upload
      cleanup_lambda: pdf-compress-cleanup-s3-prod
    security_notes:
      - temp files are stored for a limited time (S3 lifecycle assumed)
      - keepSource=true avoids race deletion during parallel processing
  fitbit:
    oauth:
      callback_lambda: fitbit-callback
      token_storage: S3 token.json
      refresh_persistence: "Fitbitがrefresh時にtokenをローテーションするため、記事生成のdry-run時も更新tokenはS3へ保存する"
    draft_generation:
      script: admin-app/scripts/import-workouts.js
      compatibility_entry: "admin-app/scripts/import-fitbit-workouts.jsも同じ両対応処理へ委譲する"
      dry_run_policy: "Markdown記事は書き出さないが、OAuth tokenの更新は永続化する"
      content_format:
        workout_summary: "丸めた分数ジョグ(総距離km)。例: 31分ジョグ(6.01km)"
        distance_precision: "Fitbit daily activity payload の distance を小数第2位へ丸める"
        missing_distance: "距離が取得できない場合は括弧を省略する"
        missing_splits: "スプリットが取得できない場合は補足行を出力しない"
      datetime_policy:
        source: "Fitbit daily activity payload の startTime"
        multiple_runs: "同日の対象ランのうち最も早い開始時刻を記事日時にする"
        missing_start_time: "有効な開始時刻がない場合は記事を書き出さず警告する"
        timezone: "FITBIT_IMPORT_TZ_OFFSET（既定540分/JST）をISO 8601オフセットとして保存する"
      run_detection:
        default_activity_names: "Structured Workout, Run, Treadmill run, Trail run, Incline run"
        default_activity_ids:
          - 91060
        note: "FitbitがランをWorkoutとして返す場合もActivity ID 91060で対象にする"
        consecutive_empty_stop: "対象Activityが5日連続で見つからない場合は異常として取込を停止する"
        rate_limit_stop: "Fitbit APIが429またはRESOURCE_EXHAUSTEDを返した場合は日付範囲の取込を停止する"
    storage: TODO
  workout_import:
    entry: admin-app/scripts/import-workouts.js
    date_selection: "--date（複数指定可）、--from/--to（両端含む）、--days。既定は基準タイムゾーンの今日。重複日付は1回だけ処理する"
    source_policy:
      default: "auto: 日単位でGarminの30秒以上のランニングを先に取得。存在する日はFitbitを呼ばずGarminのみで記事生成する"
      fallback: "Garmin検索が成功し対象ランが0件の日だけFitbitを取得する。同日両方で走った場合もGarminのみを採用する"
      overrides: "--source auto|garmin|fitbit。fitbit指定はGarmin環境・認証を必要としない"
      failures: "Garmin認証・通信・rate limit・不正データはデータなしと区別し、その日を生成せず範囲取込を停止して非0終了する"
      fitbit_initialization: "Fitbit token/S3設定はFitbit取得が必要になった時だけ確認・読み込み・refreshする"
    output:
      format: "既存frontmatterと分数ジョグ(距離km)、スプリット矢印形式を維持。心拍・GPS・パワーの新規本文項目は追加しない"
      filename: "両ソースともYYYY-MM-DD-fitbit-workout.mdを維持し、既存URLを変更しない"
      existing_posts: "同日の既存取込記事（番号付きの過去ファイルも含む）がある場合はAPI取得前にスキップ。上書きや番号付き再生成はしない"
      datetime: "選択ソースの最も早いラン開始時刻。Garmin startTimeGMTをFITBIT_IMPORT_TZ_OFFSET（既定JST）へ変換する"
      garmin_units: "duration秒をms、distanceメートルをkmへ変換する"
      garmin_splits: "記録済み1kmラップと最終端数を表示。1kmに揃わないラップは推測で分割せずスプリットを省略する。ラップ詳細の404も省略する"
      dry_run: "--dry-runまたはFITBIT_IMPORT_DRY_RUN=true。記事を書かずMarkdownを表示するが、使用ソースのtoken refreshは永続化する"
      empty_days: "両ソースの対象ランが5日連続でない場合は範囲取込を停止し非0終了。閾値はFITBIT_MAX_CONSECUTIVE_EMPTY_DAYS"
      errors: "Fitbitの日次取得失敗と詳細取得401/429/5xxは範囲取込を停止して非0終了する。詳細403/404等の未提供・スコープ不足はスプリットを省略できる"
      fitbit_precision: "64bit logIdを文字列で保持して詳細URLに使用する。TCXの総距離だけのlapを均等割りして1kmスプリットを生成しない"
  garmin:
    purpose: "個人アカウントの詳細取得CLIと、両対応記事取込へラン・ラップを渡すJSONインターフェース"
    integration: "非公式python-garminconnect 0.3.16を使用。Garmin側の変更で利用できなくなる可能性がある"
    runtime: "Python 3.12以上。uvでadmin-app/.venv-garminを作成し、requirements-garmin.txtの固定依存をインストールする"
    entry: admin-app/scripts/garmin.sh
    authentication:
      login: "ユーザー自身がTTYでメールアドレス・非表示のパスワード・必要時に非表示のMFAコードを入力する"
      token_storage: "~/.garminconnect/garmin_tokens.json（directory 0700 / file 0600）"
      persistence: "初回ログインと以後のtoken refreshはローカル保存。パスワードは保存しない"
      fetch: "保存済みtokenのみ使用。未認証・認証切れはエラー終了し、ログイン入力に切り替えない"
    data_flow:
      - "指定日（Garminのローカル日付）のrunning activitiesを検索"
      - "各活動のsummary・splits・details JSON、元のFITを含むZIP、TCXを取得"
      - "~/.garminconnect/activities/{YYYY-MM-DD}/に保存（directory 0700 / files 0600）"
      - "manifest.jsonに結果・部分失敗を記録。認証エラー・rate limitでは停止する"
      - "import-data --dateはラン・ラップの必要項目だけをJSONでstdoutへ返す。詳細ZIP/TCXの保存は行わない"
    boundaries:
      - "Garminの活動変更・削除・アップロードAPIは呼ばない。OAuth token更新は行う"
      - "Python CLI自体はAWS・公開サイト・Astro記事へ書き込まない。記事生成と日単位の重複排除はNode importerが担う"
      - "詳細の有無は実データで確認する。取得不能の値やスプリットを推測で生成しない"
  draw_backend:
    routes:
      - /draw/
      - /draw/play/
      - /draw/result/
    behavior:
      - API Gateway + Lambda backend for prompt/upload-url/submit/leaderboard/submission
      - GET /api/draw/prompt provides server-authoritative monthly prompt
      - frontend uses PUBLIC_DRAW_API_BASE to call /api/draw/*
      - frontend API requests use finite timeouts and expose retryable errors instead of indefinite loading states
      - draw result renders a saved score independently from prompt and leaderboard availability
      - Lambda handlers are bundled as CommonJS (.cjs) for Node 20 runtime compatibility
      - "`npm run build --prefix backend/draw` rebuilds both `dist/*.cjs` and deployable `artifacts/*.zip`"
      - prompt switches monthly (JST) with fixed sequence; 2026-02 is index 0 (熊)
      - image upload via S3 signed PUT
      - S3 request checksum calculation and response checksum validation use WHEN_REQUIRED
      - CloudFront signed URL for image viewing (900s)
      - primary review displays score, a fuller 4-sentence review comment assembled server-side from summary/goodPoint/improvement/nextStep fields, tips, and derived breakdown without secondary follow-up
      - draw review presentation has standard and child modes; both use the same stored rubric, score, breakdown, and ranking, while child mode displays only a hiragana, preschool-friendly review and tips
      - the 30-second canvas starts with a dark pen and offers one-tap colors, a white eraser, and one-step undo; it exports an opaque white PNG without changing the upload or scoring contract
      - the archive displays the same finalized Top20 images as a responsive gallery; opening a work still fetches its existing detail endpoint on demand
      - frontend respects the server-provided rankingEligible flag; past-month results are labeled as practice and do not load the leaderboard
      - the selected review presentation mode is stored in the browser and applies consistently to new result pages and archive detail modals
      - new submissions store both standard and child review variants from the same primary scoring response; archived Top20 submissions created before rollout are backfilled once so archive reads never trigger AI generation
      - share card generated in browser
      - submit/upload APIs resolve promptId and promptText server-side from month rules
      - primary scoring uses OpenAI GPT-5.6 Luna (`gpt-5.6-luna`) with reasoning.effort=none (fallback to stub); existing submissions are re-scored with the same model before rollout completion
      - primary scoring asks AI for a 6-axis rubric (0-10 each) with stricter anchored meanings (0-2 invalid, 3-4 weak, 5-6 normally understandable, 7 clearly above normal, 8 rare, 9 very strong, 10 exceptional)
      - primary score is computed server-side from a weighted average of rubric values plus a light structural bonus, clamped into 20-100
      - weighted score uses promptMatch*0.30, shapeClarity*0.22, completeness*0.16, composition*0.14, creativity*0.10, lineStability*0.08
      - light score bonus adds only small lifts when promptMatch, shapeClarity, completeness, and lineStability are all reasonably strong, and a small penalty when promptMatch is very low
      - legacy breakdown (likeness/composition/originality) is derived from rubric for frontend compatibility
      - OpenAI token usage and estimated USD cost are stored per submission (input/output/total/cached-input/cache-write/model/provider/latency), using the current model pricing table
      - draw routes are included in sitemap and linked from global nav
      - /draw/archive/ provides only finalized monthly Top20 history from 2026-02 through the previous JST month (client fetches month-by-month leaderboard)
      - /draw/archive/ ranking cards open a client-side detail modal that fetches submission detail on demand from GET /api/draw/submission
      - draw backend resources use cost allocation tags (Service=draw, Env=prod)
      - monthly cleanup keeps only previous month's Top20 images and deletes others from S3
      - draw submissions remain in DynamoDB long enough for monthly final ranking, and monthly cleanup extends Top20 rows to long-term retention for archive pages
  mini_games:
    routes:
      - /games/
      - /games/balloon-catch/
      - /games/cushion-catch/
      - /games/tv-catch/
      - /games/window-catch/
      - /games/dressup/
      - /games/dressup-next/
      - /games/match-quiz/
      - /games/janken/
      - /games/clock/
      - /games/snake/
      - /games/maze/
      - /games/tic-tac-toe/
      - /games/reversi/
      - /games/music/
    behavior:
      - /games/ is the hub page for lightweight browser games
      - global nav links separately to /draw/ and /games/ to keep draw as a first-class feature
      - /games/ includes the draw game as the featured card and links to fourteen lighter mini-games
      - balloon-catch, cushion-catch, tv-catch, window-catch, snake, maze, tic-tac-toe, reversi, janken, clock, dressup, dressup-next, and match-quiz are shipped as static Astro pages with client-side logic and no backend dependency
      - individual mini-game pages render their related-game sidebar from a shared component so public game links, including /games/dressup-next/ and /draw/, stay consistent across pages; the current page remains visible as a non-link item
      - /games/balloon-catch/ is a 30-second balloon catching game where the player moves a dog horizontally to catch balloons thrown by a CPU character, offers おそい/ふつう/はやい difficulty settings, uses only pre-generated game assets, draws the dog from the selected sprite sheet rather than separate dog pose images, and provides a wide play mode that uses the Fullscreen API when available with a CSS overlay fallback
      - /games/cushion-catch/ is a 30-second child-friendly timing game where the same dog moves horizontally and catches cushions only after their first bounce; coarse-pointer touch devices hide the movement/catch buttons and use tap or drag to move plus a contextual tap to catch when a bounced cushion is in range, while fine-pointer, keyboard, and gamepad controls retain their buttons or existing inputs; やさしい is tuned for preschool children with a slower throw, faster dog, narrower landing area, wider catch radius, and a brief catchable pause on the floor after the rebound, while ふつう and むずかしい retain immediate misses on the second landing; it also offers landing markers, normal and sparkling cushions, a three-catch ふわふわタイム score bonus, non-punitive misses, synthesized sound effects with mute, per-difficulty local best scores, and the same wide play fallback as balloon-catch
      - /games/tv-catch/ is a 30-second child-friendly game where a comic troublemaker approaches a television on a shelf, bumps it into a randomized falling arc, and the player moves the same dog horizontally for an automatic catch; おそい/ふつう/はやい change the approach and fall timing, one television is active at a time, catches score one point, misses have no penalty and show a soft floor bounce without breakage, and the page provides keyboard, touch, gamepad, and the same wide play fallback as balloon-catch
      - /games/window-catch/ is a 30-second child-friendly daytime game where a cloud-riding comic troublemaker approaches one of eight upper-floor windows on a single apartment building, makes it shake as a warning, and drops it mostly vertically; after either a catch or a completed miss bounce, the troublemaker continues smoothly from the current position and flies offscreen before the next round instead of jumping to a fixed position; the player moves an elephant horizontally for a generous full-body automatic catch, with a raised-trunk catch pose, one point per catch, no miss penalty, a soft floor bounce without breakage, おそい/ふつう/はやい timing settings, keyboard/touch/gamepad controls, and the same wide play fallback as balloon-catch
      - /games/match-quiz/ is a local-first image-to-text multiple-choice quiz that starts from seeded sample sets, keeps quiz-start as the primary in-page CTA, stores cards in browser storage through a repository layer, and keeps quiz generation separate from the UI for future media/login/sync expansion
      - /games/match-quiz/ seeds read-only sample sets and lets users create or delete custom local sets; only custom sets can add or delete cards
      - /games/dressup/ is a theme-based outfit duel where the player dresses a mannequin by tapping body regions, each slot also offers a `なし` option, Chat-san chooses outfit parts in fixed order with about two seconds of visible thinking per part, and the round ends by asking which coordinate is preferred rather than auto-scoring
      - /games/dressup-next/ is a public PNG-layer dress-up game that keeps /games/dressup/ unchanged, offers selectable base models shared by the player and Chat-san, reuses the same clothing/accessory assets with fit data in a dedicated model manifest independent of asset catalog generation, uses anatomical transform origins (head, neckline, waist, and each ankle) with per-model defaults merged with partial per-item corrections, offers about twenty image-preview choices per clothing/accessory slot with in-slot previous/next pagination, hides editing hotspots after completion, lets Chat-san visibly choose parts in fixed order, and is included in sitemap.xml and the games service worker caches
      - /games/janken/ provides Chat-san mode and local 1v1 mode, uses one-round matches, waits briefly before Chat-san reveals a hand, and uses sequential hidden input for local two-player play
      - /games/clock/ asks the player to match a target time by dragging the analog clock hands directly, carries the hour forward or backward when the minute hand crosses 12, offers やさしい/ふつう/むずかしい difficulty levels (whole hours / half hours / 5-minute steps), and checks correctness only when the player presses the answer button
      - /games/music/ is a static, browser-only four-mode music game for reading a single note on treble or bass staff, tapping 4/4 rhythms including rests, recognizing one heard pitch, and repeating short melodies; the four modes share a twelve-semitone-capable keyboard and synthesized Web Audio engine, show white keys by default, and finish after ten questions or bars without account or server persistence
      - music pitch identity (MIDI/pitch class/octave) is separate from staff notation (letter/accidental), notation uses small SVG drawings, and rhythm input is judged against a monotonic performance clock with configurable timing windows
      - music staff clefs and quarter rests use small local SVG outlines extracted from SMuFL Bravura, with the G and F clefs anchored to the G4 second line for treble and F3 fourth line for bass
      - rhythm play waits for an explicit start action, shows a four-beat count-in before the first bar, starts the first 4/4 bar with two quarter rests and two quarter notes, and gives a two-beat notation preview between bars; every bar begins with a quarter rest, and each ten-bar run selects varied 4/4 patterns before play so the preview, timing judgment, and displayed notation stay in sync
      - synthesized pitches use MIDI 60 as C4 and MIDI 69 as A4 at 440 Hz with twelve-tone equal temperament
      - /games/snake/ offers three speed modes (おそい / ふつう / はやい), defaults to ふつう on each visit, and applies the selected speed when the player presses start/restart
      - /games/balloon-catch/, /games/cushion-catch/, /games/tv-catch/, /games/window-catch/, /games/maze/, and /games/snake/ accept Gamepad API input in addition to keyboard and touch controls, with Android Chrome as the primary target environment
      - /games/balloon-catch/, /games/cushion-catch/, /games/tv-catch/, /games/window-catch/, /games/maze/, and /games/snake/ treat directional input as game-priority while the page is open, preventing page scroll and browser focus navigation from arrow-key-like controller input
      - gamepad support maps D-pad and left stick to movement, uses a primary button for restart/start or manual catch in cushion-catch, and a secondary button for pause in snake
      - reversi provides AI play and local two-player mode, with localStorage used only for settings persistence; a player with no legal move passes automatically, two consecutive passes end the game, and delayed AI moves are consumed before advancing the turn so a pass-triggered follow-up AI turn cannot lose its reservation
      - a dedicated Service Worker quietly enables offline use for /games/ and /games/* after those routes are visited once online
      - offline caching is limited to the mini-game hub, individual mini-game pages, and their same-origin static assets
  blog:
    indexing_policy:
      - category 練習(弱) article pages are noindex,follow
      - category 練習(中) article pages are noindex,follow
      - category 練習(デフォルト) article pages are noindex,follow
      - monthly summary article pages (`*-summary-*` and `*-summary`) are noindex,follow
      - those categories are excluded from sitemap.xml
      - summary article pages are excluded from sitemap.xml
      - blog and archive listing pages continue to link to those articles for human navigation
      - /archive/ lists published articles by year/month, shows each article category, and supports client-side category filtering via the category query parameter
      - sidebar category navigation keeps /category-map.json limited to recent items per category and links to /archive/?category=... for older category history

